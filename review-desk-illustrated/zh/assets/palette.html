<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾色 · 暖岸色板</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf5e8;color:#332720;font:16px/1.5 "Microsoft YaHei",sans-serif}header,main{padding:0 5%}header{height:55px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d5c9b9}header b{font-size:20px;letter-spacing:.05em}header span,.index,.label{font:12px/1.5 Consolas,monospace;letter-spacing:.09em}.index{color:#816b5d}main{padding-top:21px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:19px}h1{margin:1px 0 0;font:46px/1.12 Georgia,serif;letter-spacing:-.06em}#hint{color:#615144;font-size:13px}.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}button{font-family:inherit;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:inherit}button i{display:block;height:124px;border-radius:60px 60px 4px 4px;background:var(--c)}button:nth-child(even) i{border-radius:4px 4px 60px 60px}button b{display:block;margin:7px 0 0;font:600 15px Consolas,monospace}footer{margin-top:15px;font-size:12px;color:#736355}
</style>
<header><b>◒　拾色</b><span>PALETTE NOTES</span></header>
<main><div class="top"><div><span class="index">COLLECTION 01 / 暖岸</span><h1>Coastal Clay</h1></div><div id="hint" role="status">选择色块，复制 HEX</div></div>
<div class="swatches"></div><footer>Tab 切换色块　·　Enter 复制</footer></main>
<script>
for (const hex of ['#44344F','#A85D63','#F29D55','#E8C981','#84947A']) {
  const button=document.createElement('button');
  button.style.setProperty('--c',hex);
  button.innerHTML='<i></i><b>'+hex+'</b>';
  button.onclick=async()=>{
    try{await navigator.clipboard.writeText(hex);document.getElementById('hint').textContent='✓ 已复制 '+hex;}
    catch{document.getElementById('hint').textContent='请手动复制 '+hex;}
  };
  document.querySelector('.swatches').append(button);
}
</script></html>
